[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperobjects-spec"
version = "0.13.0"
description = "The MADFAM hyperobject commons spec: validate a Fashion Cabinet or Yantra4D cartridge with zero platform code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Innovaciones MADFAM SAS de CV" }]
keywords = ["hyperobject", "commons", "cartridge", "cadquery", "conformance", "spec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
# Geometry verification (`y4d-spec check --render`) needs a real CAD kernel and a
# mesh library. Kept out of the base install so manifest conformance stays a
# pure-python, seconds-fast check anyone can run.
#
# cadquery is capped below 2.8: 2.8 added a numba/llvmlite dependency that has no
# wheel for CPython 3.13, so an unpinned install fails to build on the interpreter
# this package targets. 2.7.0 is also the version yantra4d's own venv runs.
#
# scipy and networkx are not optional here despite being trimesh "extras":
# mesh.split() needs a graph engine and raises ImportError without one, and the
# split-into-bodies check is exactly how an inverted shell is caught. networkx is
# additionally what trimesh's submesh() reaches for on a mesh WITH holes — i.e. on
# precisely the broken cartridges this lane exists to report.
#
# rtree is here for the same reason and was missing for the same reason. The
# printability thin-wall measurement calls trimesh.proximity.thickness at its default
# method="max_sphere", which goes max_tangent_sphere -> longest_ray -> mesh.ray ->
# Trimesh.triangles_tree -> trimesh.util.bounds_tree -> `import rtree` (verified
# against trimesh 5.1.0's proximity.py:583, ray/ray_triangle.py:59, util.py:1896).
# Without it the call raised ModuleNotFoundError on every mesh, the note never fired,
# and the two tests that assert it fires passed only where the geometry lane skipped
# entirely. Declaring it here is what the code already required; y4d_spec.printability
# now also names the package out loud rather than swallowing its absence.
geometry = [
  "cadquery>=2.4,<2.8",
  "trimesh>=4.0",
  "scipy>=1.10",
  "networkx>=3.0",
  "rtree>=1.0",
]
dev = ["pytest>=8", "ruff>=0.6"]
# The AAS projection (hyperobjects_aas) needs only jsonschema at runtime. This extra adds
# the Eclipse BaSyx Python SDK (MIT), pinned to the release that implements metamodel
# v3.1.2, so `aas check` can also round-trip every environment through an independent
# strict deserializer. Dev/verification only: nothing imports it unless it is installed.
aas-verify = ["basyx-python-sdk==2.2.0"]

[project.urls]
Homepage = "https://github.com/madfam-org/hyperobjects-spec"
Source = "https://github.com/madfam-org/hyperobjects-spec"

[project.scripts]
fc-spec = "fc_spec.cli:main"
y4d-spec = "y4d_spec.cli:main"
ho-bridge = "bridge_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fc_spec = ["schemas/*.json"]
hyperobjects_schemas = ["schemas/*.json"]
# The vendored AAS v3.1.2 JSON Schema (CC-BY-4.0, see schemas/VENDORED.md) and its lock.
hyperobjects_aas = ["schemas/*.json", "schemas/*.md", "schemas/*.txt"]
"y4d_spec.graph" = ["*.json", "VENDORED.md"]
# The lexicon corpus is data the package ships and is the only reader of. One JSON
# file per term (see hyperobjects_lexicon/lexicon.py for why JSON, not YAML).
hyperobjects_lexicon = [
  "terms/*.json", "catalogs/*.json", "vocabularies/*.json", "vocabularies/fabrication/*.json",
]
# Canonical licence texts, byte-identical to SPDX license-list-data (VENDORED.md), and
# their sha256 lock. Read by the shipped-LICENSE body check.
hyperobjects_licenses = ["texts/*.txt", "licenses.lock.json", "VENDORED.md"]
# The standard-parts catalog (ASM-1 §4): one JSON file per COTS part, validated by
# hyperobjects_schemas' standard-part.schema.json.
hyperobjects_standard_parts = ["parts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "geometry: requires the [geometry] extra (cadquery + trimesh)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# The vendored graph engine is a BYTE-IDENTICAL copy of the platform's
# apps/api/services/engine/graph_engine.py, pinned by sha256 in
# src/y4d_spec/graph/graph.lock.json and enforced by scripts/qa/check_graph_sync.py.
# Two of its lines are 102 characters, which is yantra4d's limit and not this repo's.
# Reformatting them here would break the hash — and the byte-identity is the whole
# mechanism: it is what makes a verdict in this package a verdict about the script the
# platform actually runs. So the copy is excluded from lint rather than edited to suit
# it, exactly as a vendored dependency would be. Everything the keystone AUTHORS around
# the engine (graph_render.py, __init__.py, the guard) is linted normally.
#
# tests/fixtures/assembly-golden/commons is the same kind of copy: eight solid cartridges
# and assemblies A and B, byte-identical to solid-hyperobjects main, because their GOC-1
# tree digests (and so the assembly digests the golden tests pin) are over those exact
# bytes. The commons lints its own cartridges; editing the copies would break the pin.
extend-exclude = ["src/y4d_spec/graph/graph_engine.py", "tests/fixtures/assembly-golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
