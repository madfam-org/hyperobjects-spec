name: Render environment
description: >-
  Installs the commons render environment on a GitHub-hosted runner: the
  OpenSCAD snapshot this keystone pins (same version, same SHA-256, the same
  AppImage extraction as the platform and ARC images) and the shared libraries
  OpenSCAD and OCP link against, with `openscad` on PATH.

# Why this exists (R116, ruled 2026-10-05): this repository is public, so its
# workflows run on GitHub-hosted ubuntu-24.04, not on MADFAM's ARC pool. The ARC
# runner image bakes this environment in (madfam-org/enclii,
# infra/docker/arc-runner/Dockerfile, "Render environment (G16)"), and the
# pytest job leaned on it without installing anything: the OpenSCAD tests
# (tests/test_openscad_render.py, tests/test_parity.py) found the image's
# /usr/local/bin/openscad, and they skip on a machine without one. A hosted
# runner has no OpenSCAD, and Ubuntu's apt package (2021.01) cannot render the
# pinned BOSL2. So this action installs what the ARC image carries, and nothing
# else.
#
# ONE SOURCE OF TRUTH. The version, the checksum and the package list are read
# from this repository's own contract, src/y4d_spec/render_environment.py,
# through the `y4d-spec render-env` console script installed from this
# checkout. The ARC image and the platform image are both held to that module,
# so a change to it moves this job's environment in the same commit; there is no
# copy of the pin in this file to forget.
#
# On top of the contract: the four X libraries the ARC image adds because Qt and
# OCC link them unconditionally (libxcursor1 libxft2 libxinerama1 libxext6), and
# the `fc-cache -f` it runs after installing the fonts.
#
# Like the ARC image, this puts `openscad` on PATH (/usr/local/bin) and sets no
# OPENSCAD or OPENSCAD_PATH variable, so y4d-spec resolves the binary exactly as
# it did there.
#
# The AppImage (~80 MB) is kept in the Actions cache, so runs do not each fetch
# it from files.openscad.org. A restored copy is checksummed exactly
# like a fresh download before anything runs it.

inputs:
  y4d-spec:
    description: The installed y4d-spec console script whose render-env contract is installed.
    required: false
    default: .venv/bin/y4d-spec

outputs:
  openscad-version:
    description: The OpenSCAD snapshot that was installed.
    value: ${{ steps.pin.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read the render-environment contract (y4d-spec render-env)
      id: pin
      shell: bash
      env:
        Y4D_SPEC: ${{ inputs.y4d-spec }}
      run: |
        set -euo pipefail
        version=$("$Y4D_SPEC" render-env --openscad-version)
        sha256=$("$Y4D_SPEC" render-env --openscad-sha256)
        packages=$("$Y4D_SPEC" render-env --apt --ci)
        if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || ! [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error title=Render environment::y4d-spec render-env gave an unusable pin (version '$version', sha256 '$sha256')"
          exit 1
        fi
        for p in $packages; do
          if ! [[ "$p" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
            echo "::error title=Render environment::y4d-spec render-env --apt gave an unusable package name: '$p'"
            exit 1
          fi
        done
        {
          echo "version=$version"
          echo "sha256=$sha256"
          echo "packages=$packages"
        } >> "$GITHUB_OUTPUT"
        echo "OpenSCAD $version, AppImage sha256 $sha256"
        echo "apt (contract): $packages"

    - name: Restore the OpenSCAD AppImage
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/openscad-appimage
        key: openscad-appimage-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

    - name: Install the render libraries
      shell: bash
      env:
        PACKAGES: ${{ steps.pin.outputs.packages }}
      run: |
        set -euo pipefail
        # apt is bounded, as across the estate since an unreachable git-core PPA hung a job for 28 min on 2026-09-02.
        sudo find /etc/apt/sources.list.d -name '*git-core*' -delete || true
        sudo timeout 300 apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3
        # PACKAGES is validated above and deliberately word-split.
        # shellcheck disable=SC2086
        sudo timeout 600 apt-get install -y --no-install-recommends \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 \
          $PACKAGES libxcursor1 libxft2 libxinerama1 libxext6
        sudo fc-cache -f

    - name: Install OpenSCAD ${{ steps.pin.outputs.version }}
      shell: bash
      env:
        OPENSCAD_VERSION: ${{ steps.pin.outputs.version }}
        OPENSCAD_SHA256: ${{ steps.pin.outputs.sha256 }}
        APPIMAGE_DIR: ${{ runner.temp }}/openscad-appimage
        EXTRACT_DIR: ${{ runner.temp }}/openscad
      run: |
        set -euo pipefail
        appimage="$APPIMAGE_DIR/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage"
        if [ ! -f "$appimage" ]; then
          mkdir -p "$APPIMAGE_DIR"
          # --fail: without it a 404 body is written to the file and only the
          # checksum below would notice a moved artifact.
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://files.openscad.org/snapshots/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage" \
            -o "$appimage.part"
          mv "$appimage.part" "$appimage"
        fi
        if ! echo "${OPENSCAD_SHA256}  ${appimage}" | sha256sum -c -; then
          rm -f "$appimage"
          echo "::error title=Render environment::OpenSCAD AppImage checksum mismatch"
          exit 1
        fi
        chmod +x "$appimage"
        # AppImages need FUSE to run in place; extracting does not, and is what
        # the platform and ARC images do.
        rm -rf "$EXTRACT_DIR"
        mkdir -p "$EXTRACT_DIR"
        (cd "$EXTRACT_DIR" && "$appimage" --appimage-extract > /dev/null)
        sudo ln -sf "$EXTRACT_DIR/squashfs-root/AppRun" /usr/local/bin/openscad
        resolved=$(command -v openscad)
        if [ "$resolved" != "/usr/local/bin/openscad" ]; then
          echo "::error title=Render environment::openscad resolves to $resolved, not the pinned snapshot"
          exit 1
        fi
        banner=$(openscad --version 2>&1)
        banner=${banner%%$'\n'*}
        echo "$banner"
        case "$banner" in
          *"$OPENSCAD_VERSION"*) ;;
          *) echo "::error title=Render environment::openscad reports '$banner', not $OPENSCAD_VERSION"; exit 1 ;;
        esac
