name: CI

# Runners (R116, ruled 2026-10-05): this repository is public, so its jobs run on
# GitHub-hosted ubuntu-24.04 and never on MADFAM's self-hosted ARC pool. `runs-on`
# is the ADR-010 expression enclii and janua use: the org variable
# ARC_BOOTSTRAP_COMPLETE is not visible to public repositories, so it resolves to
# `ubuntu-24.04`. The OpenSCAD snapshot and render libraries the ARC image used
# to carry come from .github/actions/render-env.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP)
        # The [geometry] extra pulls OCP (OpenCascade), whose C-extension links against
        # system X and GL libraries at import. Install them so geometry ACTUALLY runs
        # here rather than skipping — the `geometry available: True` line below is the
        # read-proof, and it is now enforced rather than merely printed.
        #
        # libgl1 alone was not enough, and the gap was invisible because this step still
        # succeeded. Run 33635600083 on this branch printed the import that libGL cannot
        # satisfy:
        #
        #   File ".venv/lib/python3.12/site-packages/OCP/__init__.py", line 1
        #     from OCP.OCP import *
        #   ImportError: libXrender.so.1: cannot open shared object file
        #
        # libXrender is asked for by the VTK renderer OCP.so links (libvtkRenderingOpenGL2
        # NEEDs libXrender.so.1, as does the libXcursor vendored beside it), and NOTHING in
        # the libgl1 dependency tree pulls it in: libgl1 -> libglx0/libglvnd0 -> libX11,
        # libxcb, libxxf86vm — no libxrender1 anywhere. So it must be named here. libX11
        # itself does arrive with libgl1, which is why libXrender was the only soname the
        # loader could not resolve.
        #
        # apt is bounded (retries, timeout, a hard cap on update) so a slow mirror costs a
        # minute rather than the job's twenty. The step still never fails on its own: a
        # runner that forbids apt should reach the read-proof below and be told exactly
        # which library is missing, not die here with the reason unprinted.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 \
              || echo "::warning::could not install the CAD kernel's system libraries — the read-proof below will say which one is missing"
          else
            echo "::warning::apt-get unavailable — the read-proof below will say which library is missing"
          fi

      - name: Create a clean virtualenv
        run: python3 -m venv .venv

      - name: Install (with geometry + dev extras)
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[geometry,dev]"

      - name: Install the render environment (OpenSCAD + render libraries)
        # The OpenSCAD tests (tests/test_openscad_render.py, tests/test_parity.py)
        # skip on a machine with no `openscad`. On the ARC pool the runner image
        # carried the pinned snapshot; a GitHub-hosted runner has none, so this
        # installs the one src/y4d_spec/render_environment.py pins, read through
        # the console script just installed. `-ra` below names any skip.
        uses: ./.github/actions/render-env
        with:
          y4d-spec: .venv/bin/y4d-spec

      - name: Verify graph contract in the distributable wheel
        run: |
          .venv/bin/pip wheel --no-deps . -w dist
          .venv/bin/python scripts/qa/check_graph_wheel.py dist/*.whl

      - name: Report what is installed
        # Read-proof: the summary below claims geometry ran, so say what is present.
        #
        # `geometry available: False` on its own is unreadable: geometry_available()
        # catches Exception and returns a bool, so the ONE fact a dark lane needs to
        # report — which import failed and why — is exactly the fact it swallows. So
        # import each piece here and print the traceback it actually raised, and scan
        # the installed extension modules for shared libraries the loader cannot find.
        # Neither of those two may fail the step: they are the diagnosis, and the
        # `geometry available:` line is the verdict — which is now enforced, because a
        # lane that reports its own absence in one word and then goes on to print
        # `passed` is how this went unnoticed for every run on main.
        #
        # One caveat when reading the soname list: auditwheel's vendored copies carry a
        # hash in the name (`libXfixes-d274cb03.so.3.1.0`), and those resolve through the
        # RPATH of the library that actually loads them, so they can appear here on a
        # perfectly healthy install. A bare system soname — `libXrender.so.1` — is the
        # real signal.
        run: |
          .venv/bin/python -c "import fc_spec, y4d_spec, pliego_spec, commons_sandbox, hyperobjects_schemas; print('packages ok')"
          .venv/bin/python - <<'PY' || true
          import platform, sys, traceback

          print("python:", sys.version.replace("\n", " "))
          print("platform:", platform.platform())
          for name in ("OCP", "vtkmodules.all", "cadquery", "trimesh", "rtree", "scipy", "networkx"):
              try:
                  __import__(name)
              except BaseException:
                  print(f"import {name}: FAILED")
                  traceback.print_exc()
              else:
                  print(f"import {name}: ok")
          PY
          echo "--- shared libraries the CAD stack asks for and cannot find ---"
          SP=$(echo .venv/lib/python*/site-packages)
          find "$SP/OCP" "$SP/cadquery_ocp.libs" "$SP/vtkmodules" "$SP/vtk.libs" \
               -name '*.so*' 2>/dev/null \
            | xargs -r -n1 ldd 2>/dev/null \
            | awk '/not found/ {print $1}' | sort -u \
            | tee /tmp/missing-sonames.txt
          test -s /tmp/missing-sonames.txt || echo "(none)"
          .venv/bin/python - <<'PY'
          from y4d_spec.geometry import geometry_available

          available = geometry_available()
          print("geometry available:", available)
          if not available:
              raise SystemExit(
                  "FATAL: the geometry lane cannot run on this runner. The tracebacks and the "
                  "missing-soname list above name the cause. Failing here on purpose: the suite "
                  "skips the geometry, preset-matrix and printability tests cleanly when the CAD "
                  "kernel will not import, so the alternative is a green run that verified none "
                  "of them and said so only in a line nobody reads."
              )
          PY

      - name: Graph-engine drift guard
        # BLOCKING. The vendored transpiler (src/y4d_spec/graph/) must match the sha256
        # hashes in graph.lock.json. It is a byte-identical copy of the platform's
        # apps/api/services/engine/graph_engine.py, and the whole reason a graph
        # cartridge's verdict here means anything is that the keystone transpiles it with
        # the SAME code the platform runs. A hand-edit, or a copy left stale after the
        # platform moves, turns this red — and the platform's own spec-conformance job
        # asserts the reverse direction, so neither repo can drift alone. See
        # src/y4d_spec/graph/VENDORED.md.
        run: .venv/bin/python scripts/qa/check_graph_sync.py

      - name: Lint
        run: .venv/bin/ruff check src tests scripts

      - name: Test
        # -ra so skipped geometry tests are named in the summary rather than hidden —
        # a green run that silently skipped the render lane must not read as a full one.
        #
        # Since the read-proof step above now FAILS the job when the CAD kernel will not
        # import, the geometry lane cannot skip here at all and this job reports 0
        # skipped. -ra stays because that is what would make a regression back to
        # skipping legible in the log instead of invisible inside a green run.
        run: .venv/bin/python -m pytest -ra

      - name: Projection drift guard
        # SEM-1 §1 (owner decision 2026-10-04). Every shell and submodel id carries the
        # projection version (…/p{N}), and a store keeps those ids immutable (asset-shells
        # answers new bytes under a stored id with a 409). So the goldens — one of every
        # kind of shell — are rebuilt here, and bytes that moved under an id a golden
        # already carries fail until hyperobjects_aas.ids.PROJECTION_VERSION is bumped.
        run: .venv/bin/python scripts/refresh_assembly_golden.py --check

      - name: Pose golden guard
        # ASM-1 §9. The golden pose files are the reference forward kinematics a viewer
        # reproduces string for string (yantra4d, Phase 7): home, every limit and the
        # seeded Halton samples of assemblies A and B and the kinematic gantry fixture.
        # A pose that moves fails here until the files are refreshed and the diff reviewed.
        run: .venv/bin/python scripts/refresh_pose_golden.py --check

      - name: Self-check against the bundled fixtures
        # Exercises the two console scripts exactly as a third party would.
        run: |
          .venv/bin/fc-spec list
          .venv/bin/fc-spec check garment-manifest tests/fixtures/fc/bodice-block.project.json
          .venv/bin/y4d-spec check tests/fixtures/y4d/sew-on-snap tests/fixtures/y4d/thimble
          # The G38 exemption fixtures, manifest-only: a declared exemption and a
          # widened tolerance both carry a reason, so both are conformant here. The
          # unreasoned versions are the pytest cases; this step is the proof that the
          # reasoned shape is accepted by the shipped console script, not only in-process.
          .venv/bin/y4d-spec check tests/fixtures/y4d/dual-block-exempt \
            tests/fixtures/y4d/dual-block-widened
          # THE GRAPH ROWS. The two commons graph cartridges' shape, as fixtures: a
          # graph-only cartridge and a GOLDEN TWIN (a graph plus the script it must
          # reproduce). Rendered, so the row is a real mesh judged at the house bar and
          # not a manifest check — `flange-plate` and `spacer-block` were the only two of
          # 500 cartridges outside that bar until this lane existed, and the nightly in
          # the commons repo gains their rows through the same code path this exercises.
          # --parity is on so the golden twin is actually COMPARED; the divergent twin is
          # a pytest case rather than a step here, because a CI step that must fail is a
          # step someone eventually "fixes".
          # graph-twin-expr is the graph-format-1.1 golden twin: expressions (one
          # parameter through a `map`), derived clamps, select, reflect, a polyline
          # profile and the bounded revolve, compared against the script it twins.
          .venv/bin/y4d-spec check --render --parity \
            tests/fixtures/y4d/graph-block tests/fixtures/y4d/graph-twin \
            tests/fixtures/y4d/graph-twin-expr
          # G-DEADPARAM, the other way round: this fixture MUST fail, and must name the
          # three dead parameters. A rule whose only proof is that healthy cartridges
          # pass is a rule that could be switched off without anything going red.
          ! .venv/bin/y4d-spec check tests/fixtures/y4d/dead-param > dead-param.out 2>&1
          grep -q "phone_angle" dead-param.out
          grep -q "mat_width" dead-param.out
          grep -q "drive_type" dead-param.out
          # …and must NOT name the ones that are alive, scoped, or allow-listed.
          ! grep -qE "'(base_w|lever_length|drainage_angle|target_part)'" dead-param.out
          rm -f dead-param.out
          # ASM-1 §9: a posable assembly through the shipped console script — a passive
          # carriage closing a cycle, a follower pulley and a closed belt loop, checked at
          # home, every limit and the Halton sweep; the bundled catalog first, then the
          # fixture's test belt (--standard-parts is repeatable).
          .venv/bin/y4d-spec assembly check tests/fixtures/kinematics/kinematic-gantry.assembly.json \
            --standard-parts src/hyperobjects_standard_parts/parts \
            --standard-parts tests/fixtures/kinematics/standard-parts > kinematics.out
          grep -q "joints=4 poses=21/21 paths=1" kinematics.out
          rm -f kinematics.out
          .venv/bin/y4d-spec identity examples/chainmail-panel.identity.json
          .venv/bin/y4d-spec rules
          # THE THIRD KERNEL (pliego-spec, the sheet commons). The fixtures are faithful
          # minimal sheet cartridges standing in for the commons' first real ones. The greps
          # are the read-proof: the summary must count what it checked AND say what it did
          # not (no document was built, no sheet geometry was judged).
          .venv/bin/pliego-spec list
          .venv/bin/pliego-spec check cartridge tests/fixtures/sheet/valley-fold \
            tests/fixtures/sheet/v-fold-popup tests/fixtures/sheet/papel-picado-banner > sheet.out
          grep -q "cartridges=3 failures=0 notes=3 documents=NOT built geometry=NOT verified" sheet.out
          .venv/bin/pliego-spec check sheet-manifest tests/fixtures/sheet/*/project.json
          .venv/bin/pliego-spec check sheet-document tests/fixtures/sheet-documents/valley-fold.fold > sheet.out
          grep -q "sheets=1 vertices=4 edges=5 faces=2 joins=0 geometry=NOT verified" sheet.out
          # Real kernel-0.3 output (pliego main) against the vendored contract, with the
          # spec §5.15 (RFC 8785) digest, and real stock cards against the vendored
          # stock-card schema.
          .venv/bin/pliego-spec check sheet-document tests/fixtures/sheet-documents/kernel-0.3/*.fold > sheet.out
          grep -q "contract=sheet-document files=9 failures=0" sheet.out
          .venv/bin/pliego-spec check stock-card tests/fixtures/sheet-stock/*.stock.json > sheet.out
          grep -q "contract=stock-card files=3 failures=0" sheet.out
          rm -f sheet.out
          .venv/bin/pliego-spec rules

      - name: Lexicon lane
        # Hermetic (bundled slug snapshot): schema-valid, quadrilingual-complete,
        # zero dangling cross-refs, embodied_by resolved, no unsigned review claims.
        # Sub-second.
        run: .venv/bin/fc-spec lexicon --catalog bundled

      - name: Vocabulary lane
        # The controlled vocabularies (RFC 0039 G3): every key defined or explicitly
        # undefined, every cross-commons equivalence symmetric, every false-friend pair
        # recorded on both halves, every widely-written key carrying a term. Run on the
        # OTHER tool than the lexicon lane above, so both console scripts are exercised.
        run: .venv/bin/y4d-spec vocab

      - name: Sheet-behaviour lane
        # The cross-commons sheet-behaviour contract (docs/SHEET_BEHAVIOUR.md). The goldens
        # are every real Pliego stock card (all 28: paper, board, corrugated, foam) and
        # Fashion Cabinet fabric card, two thin prints and two laminates, rebuilt and
        # compared byte for byte. The greps are the read-proof: the summary must count what
        # it checked, per source, and the laminate must report the coupling and the curl it
        # exists to compute.
        run: |
          .venv/bin/python scripts/refresh_sheet_behaviour_golden.py --check > sheet.out
          grep -q "sheet golden: documents=43 drifted=0 invalid=0 stray=0" sheet.out
          grep -q "pliego=28 fashion-cabinet=11 thin-prints=2 laminates=2" sheet.out
          .venv/bin/fc-spec sheet check tests/fixtures/sheet-behaviour/golden/*/*.json > sheet.out
          grep -q "fc-spec sheet check: files=43 failures=0" sheet.out
          F=tests/fixtures/sheet-behaviour
          .venv/bin/y4d-spec sheet laminate $F/laminates/print-on-stretched-tricot.json \
            --materials fashion-cabinet=$F/cards/fashion-cabinet 2> sheet.out > /dev/null
          grep -q "layers=2 thickness_mm=0.95 coupled=yes" sheet.out
          grep -q "curvature_1_m=\[224" sheet.out
          rm -f sheet.out

      - name: Article lane
        # The G2 frontmatter contract, against the shipped exemplar. --catalog bundled
        # resolves the object and its neighbours hermetically.
        run: .venv/bin/fc-spec article examples --catalog bundled

      - name: Reader lane
        # RFC 0039 G4. The cross-commons reader is built from the pinned snapshots and
        # COMMITTED, so this is a fail-closed diff: a rebuild that differs from
        # docs/reader by one byte, by one missing page, or by one page nobody generates
        # turns the build red. Hermetic and sub-second — no network, no platform
        # checkout, no clock in the output. The second line holds the same bar one layer
        # up: every count in README.md and docs/COMMONS_VOCABULARY.md is emitted from the
        # corpus rather than typed, so a doc cannot drift away from the data it describes.
        run: |
          .venv/bin/fc-spec reader --check
          .venv/bin/python scripts/refresh_reader_counts.py --check

      - name: Dictionary tools
        # RFC 0039 §6.2, exercised exactly as an MCP server calls them. The greps are the
        # read-proof: a `define` that resolved nothing would still exit 0 on its own.
        run: |
          .venv/bin/fc-spec define zipper_tape --lang pt | grep -q "debrum de fita"
          .venv/bin/y4d-spec define negative_ease_knit | grep -q "knit-negative-ease"
          .venv/bin/fc-spec lookup fashion-cabinet/garter-belt | grep -q "strap-slot"
          .venv/bin/y4d-spec related tape-edge | grep -q "zipper_tape"
          .venv/bin/pliego-spec define papel-picado --lang es | grep -q "Huixcolotla"

  geom-core-parity:
    # The geom-core mesh oracle (y4d_spec.mesh_oracle, G5 of the geom-core programme).
    # Every geometry test and every bundled fixture render is measured by BOTH oracles
    # (Y4D_SPEC_MESH_ORACLE=both): the verdict stays trimesh's, and a disagreement is an
    # `oracle-parity` note, counted into the job summary. NOT a required check yet (the
    # repository has no branch protection, and nothing should be made to wait on this
    # leg): it is the evidence the default flip waits on, and it reports rather than
    # gates. A red run here is still a real failure to read — an install that did not
    # happen, or a test the seam broke — never a parity disagreement, which is a note.
    #
    # Python 3.11, not the system 3.12 the pytest job uses: geom-core v0.1.0 ships
    # Linux wheels for cp38-cp311 only (scripts/qa/install_geom_core.sh refuses others).
    name: geometry with geom-core (oracle parity, not required)
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      Y4D_SPEC_MESH_ORACLE: both
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libraries for the CAD kernel (the pytest job's three)
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          timeout 300 $SUDO apt-get update -qq $APT_OPTS
          $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
            libgl1 libglib2.0-0 libxrender1

      - name: Install (geometry + dev extras) and geom-core from its release
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[geometry,dev]"
          PYTHON=.venv/bin/python scripts/qa/install_geom_core.sh

      - name: Install the render environment (OpenSCAD + render libraries)
        uses: ./.github/actions/render-env
        with:
          y4d-spec: .venv/bin/y4d-spec

      - name: Read-proof — both oracles importable
        # Without this a leg whose kernel or geom-core failed to import would skip every
        # geometry test and print a green "passed".
        run: |
          .venv/bin/python - <<'PY'
          from y4d_spec.geometry import geometry_available
          from y4d_spec.mesh_oracle import geom_core_available, require_selection

          print("geometry available:", geometry_available())
          print("geom-core available:", geom_core_available())
          print("mesh oracle:", require_selection())
          if not (geometry_available() and geom_core_available()):
              raise SystemExit("FATAL: this leg needs the CAD kernel AND geom-core")
          PY

      - name: Geometry tests with both oracles
        run: .venv/bin/python -m pytest -m geometry -ra

      - name: Render the bundled fixtures with both oracles and count oracle-parity notes
        # Some fixtures fail on purpose (dead-param, the divergent twins, frame-plate-wrong),
        # so the exit code is not the verdict here; the summary line must be present and
        # say geometry=verified, or the run crashed and the step fails.
        run: |
          set +e
          .venv/bin/y4d-spec check --render --parity tests/fixtures/y4d/*/ > oracle.out 2>&1
          status=$?
          set -e
          cat oracle.out
          summary=$(grep "^y4d-spec check: " oracle.out || true)
          if ! grep -q "geometry=verified" <<<"$summary"; then
            echo "::error::y4d-spec check produced no verified summary line (exit $status)"
            exit 1
          fi
          notes=$(grep -c ": oracle-parity: " oracle.out || true)
          {
            echo "### geom-core oracle parity (Y4D_SPEC_MESH_ORACLE=both)"
            echo ""
            echo "- oracle-parity notes: **${notes}**"
            echo "- \`${summary}\` (exit ${status}; some fixtures fail on purpose)"
            if [ "$notes" != "0" ]; then
              echo ""
              echo '```'
              grep ": oracle-parity: " oracle.out
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f oracle.out
