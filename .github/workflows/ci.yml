name: CI

# Org policy: self-hosted runners only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest
    runs-on: madfam-runners-blue
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP)
        # The [geometry] extra pulls OCP (OpenCascade), whose C-extension links against
        # system X and GL libraries at import. Install them so geometry ACTUALLY runs
        # here rather than skipping — the `geometry available: True` line below is the
        # read-proof, and it is now enforced rather than merely printed.
        #
        # libgl1 alone was not enough, and the gap was invisible because this step still
        # succeeded. Run 33635600083 on this branch printed the import that libGL cannot
        # satisfy:
        #
        #   File ".venv/lib/python3.12/site-packages/OCP/__init__.py", line 1
        #     from OCP.OCP import *
        #   ImportError: libXrender.so.1: cannot open shared object file
        #
        # libXrender is asked for by the VTK renderer OCP.so links (libvtkRenderingOpenGL2
        # NEEDs libXrender.so.1, as does the libXcursor vendored beside it), and NOTHING in
        # the libgl1 dependency tree pulls it in: libgl1 -> libglx0/libglvnd0 -> libX11,
        # libxcb, libxxf86vm — no libxrender1 anywhere. So it must be named here. libX11
        # itself does arrive with libgl1, which is why libXrender was the only soname the
        # loader could not resolve.
        #
        # apt is bounded (retries, timeout, a hard cap on update) so a slow mirror costs a
        # minute rather than the job's twenty. The step still never fails on its own: a
        # runner that forbids apt should reach the read-proof below and be told exactly
        # which library is missing, not die here with the reason unprinted.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 \
              || echo "::warning::could not install the CAD kernel's system libraries — the read-proof below will say which one is missing"
          else
            echo "::warning::apt-get unavailable — the read-proof below will say which library is missing"
          fi

      - name: Create a clean virtualenv
        run: python3 -m venv .venv

      - name: Install (with geometry + dev extras)
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[geometry,dev]"

      - name: Report what is installed
        # Read-proof: the summary below claims geometry ran, so say what is present.
        #
        # `geometry available: False` on its own is unreadable: geometry_available()
        # catches Exception and returns a bool, so the ONE fact a dark lane needs to
        # report — which import failed and why — is exactly the fact it swallows. So
        # import each piece here and print the traceback it actually raised, and scan
        # the installed extension modules for shared libraries the loader cannot find.
        # Neither of those two may fail the step: they are the diagnosis, and the
        # `geometry available:` line is the verdict — which is now enforced, because a
        # lane that reports its own absence in one word and then goes on to print
        # `passed` is how this went unnoticed for every run on main.
        #
        # One caveat when reading the soname list: auditwheel's vendored copies carry a
        # hash in the name (`libXfixes-d274cb03.so.3.1.0`), and those resolve through the
        # RPATH of the library that actually loads them, so they can appear here on a
        # perfectly healthy install. A bare system soname — `libXrender.so.1` — is the
        # real signal.
        run: |
          .venv/bin/python -c "import fc_spec, y4d_spec, commons_sandbox, hyperobjects_schemas; print('packages ok')"
          .venv/bin/python - <<'PY' || true
          import platform, sys, traceback

          print("python:", sys.version.replace("\n", " "))
          print("platform:", platform.platform())
          for name in ("OCP", "vtkmodules.all", "cadquery", "trimesh", "rtree", "scipy", "networkx"):
              try:
                  __import__(name)
              except BaseException:
                  print(f"import {name}: FAILED")
                  traceback.print_exc()
              else:
                  print(f"import {name}: ok")
          PY
          echo "--- shared libraries the CAD stack asks for and cannot find ---"
          SP=$(echo .venv/lib/python*/site-packages)
          find "$SP/OCP" "$SP/cadquery_ocp.libs" "$SP/vtkmodules" "$SP/vtk.libs" \
               -name '*.so*' 2>/dev/null \
            | xargs -r -n1 ldd 2>/dev/null \
            | awk '/not found/ {print $1}' | sort -u \
            | tee /tmp/missing-sonames.txt
          test -s /tmp/missing-sonames.txt || echo "(none)"
          .venv/bin/python - <<'PY'
          from y4d_spec.geometry import geometry_available

          available = geometry_available()
          print("geometry available:", available)
          if not available:
              raise SystemExit(
                  "FATAL: the geometry lane cannot run on this runner. The tracebacks and the "
                  "missing-soname list above name the cause. Failing here on purpose: the suite "
                  "skips the geometry, preset-matrix and printability tests cleanly when the CAD "
                  "kernel will not import, so the alternative is a green run that verified none "
                  "of them and said so only in a line nobody reads."
              )
          PY

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Test
        # -ra so skipped geometry tests are named in the summary rather than hidden —
        # a green run that silently skipped the render lane must not read as a full one.
        run: .venv/bin/python -m pytest -ra

      - name: Self-check against the bundled fixtures
        # Exercises the two console scripts exactly as a third party would.
        run: |
          .venv/bin/fc-spec list
          .venv/bin/fc-spec check garment-manifest tests/fixtures/fc/bodice-block.project.json
          .venv/bin/y4d-spec check tests/fixtures/y4d/sew-on-snap tests/fixtures/y4d/thimble
          .venv/bin/y4d-spec identity examples/chainmail-panel.identity.json
          .venv/bin/y4d-spec rules

      - name: Lexicon lane
        # Hermetic (bundled slug snapshot): schema-valid, quadrilingual-complete,
        # zero dangling cross-refs, embodied_by resolved, no unsigned review claims.
        # Sub-second.
        run: .venv/bin/fc-spec lexicon --catalog bundled

      - name: Vocabulary lane
        # The controlled vocabularies (RFC 0039 G3): every key defined or explicitly
        # undefined, every cross-commons equivalence symmetric, every false-friend pair
        # recorded on both halves, every widely-written key carrying a term. Run on the
        # OTHER tool than the lexicon lane above, so both console scripts are exercised.
        run: .venv/bin/y4d-spec vocab

      - name: Article lane
        # The G2 frontmatter contract, against the shipped exemplar. --catalog bundled
        # resolves the object and its neighbours hermetically.
        run: .venv/bin/fc-spec article examples --catalog bundled

      - name: Reader lane
        # RFC 0039 G4. The cross-commons reader is built from the pinned snapshots and
        # COMMITTED, so this is a fail-closed diff: a rebuild that differs from
        # docs/reader by one byte, by one missing page, or by one page nobody generates
        # turns the build red. Hermetic and sub-second — no network, no platform
        # checkout, no clock in the output. The second line holds the same bar one layer
        # up: every count in README.md and docs/COMMONS_VOCABULARY.md is emitted from the
        # corpus rather than typed, so a doc cannot drift away from the data it describes.
        run: |
          .venv/bin/fc-spec reader --check
          .venv/bin/python scripts/refresh_reader_counts.py --check

      - name: Dictionary tools
        # RFC 0039 §6.2, exercised exactly as an MCP server calls them. The greps are the
        # read-proof: a `define` that resolved nothing would still exit 0 on its own.
        run: |
          .venv/bin/fc-spec define zipper_tape --lang pt | grep -q "debrum de fita"
          .venv/bin/y4d-spec define negative_ease_knit | grep -q "knit-negative-ease"
          .venv/bin/fc-spec lookup fashion-cabinet/garter-belt | grep -q "strap-slot"
          .venv/bin/y4d-spec related tape-edge | grep -q "zipper_tape"
